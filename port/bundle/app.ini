# Starlight app bundle: d2decomped (Diablo II), the port's (userland/ports/d2decomped)
title=Diablo II
version=1.0.0
author=d2decomped, ported by PeOS
store_category=giochi
# threads (PeOS 0.15.0) for its sound and its loading
min_peos=0.15.0
category=svago
exec=./app.bin
args=--data /games/diablo2
# shm: the game's pixels in the window; the user's MPQs read from
# /games/diablo2; its settings, log and saves in /starlight/config/d2d;
# audio: its sounds and music, mixed by the kernel with the other programs;
# network: joining a game.exe host on the LAN (Other Multiplayer, TCP/IP)
capabilities=fs.read, fs.write, shm, audio, network
paths=/games/diablo2:r, /starlight/config:rw
icon=res:icon
width=800
height=600
min_width=640
min_height=480

# Resources
[resources]
icon=./resources/icon.png
